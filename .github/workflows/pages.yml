name: Cập nhật dashboard

on:
  schedule:
    - cron: "*/30 * * * *"   # mỗi 30 phút
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Đọc Google Sheet -> data.json
        run: node build.mjs
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          LICH_GID: ${{ vars.LICH_GID || '1007624391' }}
          TICK_GID: ${{ vars.TICK_GID || '1051999456' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
